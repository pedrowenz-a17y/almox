name: Aplicativo Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar, testar e analisar Android
        working-directory: mobile
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Conferir APK release e manifesto
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print mobile/app/build/outputs/apk/release/app-release-unsigned.apk > mobile/app/build/manifest-release.xml
          python mobile/tools/verify-apk.py mobile/app/build/outputs/apk/release/app-release-unsigned.apk mobile/app/build/manifest-release.xml mobile/app/build/apk-checks.json
      - name: Habilitar emulador no runner descartável
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: |
            ./mobile/gradlew -p mobile --no-daemon connectedDebugAndroidTest
            adb shell pm clear br.uca.almox.mobile.test
            adb shell am start -n br.uca.almox.mobile.test/br.uca.almox.mobile.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/almox-android.png
            adb pull /sdcard/almox-android.png mobile/app/build/almox-android.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Almox-Android-build
          path: |
            mobile/app/build/outputs/apk/release/*unsigned.apk
            mobile/app/build/outputs/androidTest-results/
            mobile/app/build/reports/
            mobile/app/build/almox-android.png
            mobile/app/build/manifest-release.xml
            mobile/app/build/apk-checks.json
          if-no-files-found: error
