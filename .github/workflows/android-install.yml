name: Verificar instalador Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Conferir arquivo e assinatura de distribuição
        shell: bash
        run: |
          mkdir -p android-install
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          folder = Path('android-distribution')
          apk = folder / 'Almox-ERP-Android-1.0.0.apk'
          report = json.loads((folder / 'VALIDACAO.json').read_text())
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == report['signedApkSha256']
          assert report['certificateSha256'] == Path('mobile/signing-certificate.sha256').read_text().strip()
          PY
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs android-distribution/Almox-ERP-Android-1.0.0.apk | tee android-install/signature.txt
          python - <<'PY'
          from pathlib import Path
          import re
          output = Path('android-install/signature.txt').read_text()
          digests = re.findall(r'(?m)^(?:Signer #\d+|V\d+(?:\.\d+)? Signer):? certificate SHA-256 digest: ([a-fA-F0-9]{64})\s*$', output)
          assert {value.lower() for value in digests} == {Path('mobile/signing-certificate.sha256').read_text().strip()}
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in output
          assert 'Verified using v3 scheme (APK Signature Scheme v3): true' in output
          PY
      - name: Habilitar emulador no runner descartável
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb logcat -c
            adb install android-distribution/Almox-ERP-Android-1.0.0.apk
            adb shell am start -W -n br.uca.almox.mobile/br.uca.almox.mobile.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/first-open.xml
            adb pull /sdcard/first-open.xml android-install/first-open.xml
            adb shell am force-stop br.uca.almox.mobile
            adb shell am start -W -n br.uca.almox.mobile/br.uca.almox.mobile.MainActivity
            sleep 3
            adb shell pidof br.uca.almox.mobile
            adb shell uiautomator dump /sdcard/reopened.xml
            adb pull /sdcard/reopened.xml android-install/reopened.xml
            adb shell screencap -p /sdcard/almox-release.png
            adb pull /sdcard/almox-release.png android-install/almox-release.png
            adb logcat -d > android-install/logcat.txt
            python mobile/tools/verify-installed.py android-install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Almox-Android-installation
          path: android-install/
          if-no-files-found: error
