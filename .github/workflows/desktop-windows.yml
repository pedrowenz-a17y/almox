name: Instalador Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - id: version
        run: |
          $version = node -p "require('./desktop/package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Versão inválida.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm run desktop:install
      - run: npm run desktop:test
      - run: node --import tsx --test tests/desktop-health.test.ts
      - run: npm run desktop:dist
      - run: node desktop/scripts/verify-package.cjs
      - run: node desktop/tests/verify-electron.cjs
      - run: node desktop/tests/verify-installed.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Almox-ERP-Windows-x64
          compression-level: 0
          path: |
            desktop/dist/*Setup.exe
            desktop/dist/SHA256SUMS.txt
            artifacts/desktop-2.6.0/
          if-no-files-found: error
  publicar:
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Almox-ERP-Windows-x64
          path: release
      - name: Publicar instalador aprovado nos testes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.desktop.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"
          notes="docs/ENTREGA-WINDOWS-$VERSION.md"
          test -f "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true || { echo 'Esta versão já foi publicada. Use uma nova versão.'; exit 1; }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Almox ERP $VERSION — aplicativo Windows" --notes-file "$notes"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "release/desktop/dist/Almox-ERP-$VERSION-Windows-x64-Setup.exe" \
            release/desktop/dist/SHA256SUMS.txt \
            release/artifacts/desktop-2.6.0/package-checks.json \
            release/artifacts/desktop-2.6.0/electron-checks.json \
            release/artifacts/desktop-2.6.0/installed-checks.json
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
